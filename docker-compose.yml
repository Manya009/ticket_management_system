services:

  # ─────────────────────────────────────────────
  # PostgreSQL — shared database for all app instances
  # ─────────────────────────────────────────────
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketdb
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist DB between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — shared cache + Celery message broker
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI — Instance 1
  # ─────────────────────────────────────────────
  app1:
    build: .                        # Build from your Dockerfile
    restart: always
    env_file: .env                  # Load your secrets from .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_DOCKER: postgresql://postgres:postgres@db:5432/ticketdb
      REDIS_URL: redis://redis:6379/0

  # ─────────────────────────────────────────────
  # FastAPI — Instance 2
  # ─────────────────────────────────────────────
  app2:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_DOCKER: postgresql://postgres:postgres@db:5432/ticketdb
      REDIS_URL: redis://redis:6379/0

  # ─────────────────────────────────────────────
  # FastAPI — Instance 3
  # ─────────────────────────────────────────────
  app3:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_DOCKER: postgresql://postgres:postgres@db:5432/ticketdb
      REDIS_URL: redis://redis:6379/0

  # ─────────────────────────────────────────────
  # Celery Worker — processes background tasks (ML prediction + email)
  # Only 1 worker needed — it reads from Redis queue shared by all app instances
  # ─────────────────────────────────────────────
  celery_worker:
    build: .
    restart: always
    env_file: .env
    command: celery -A app.celery_worker.celery worker --loglevel=info -Q default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL_DOCKER: postgresql://postgres:postgres@db:5432/ticketdb
      REDIS_URL: redis://redis:6379/0

  # ─────────────────────────────────────────────
  # Nginx — load balancer, the only public-facing port
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"                     # Only nginx is exposed to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:
  redis_data: