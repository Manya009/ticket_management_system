# nginx/nginx.conf

events {
    # Max simultaneous connections per worker process
    worker_connections 1024;
}

http {

    # --- Define the pool of app servers (load balancing) ---
    upstream fastapi_cluster {
        # Round-robin by default — each request goes to the next server in turn
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }

    server {
        listen 80;

        # --- Proxy all traffic to the FastAPI cluster ---
        location / {
            proxy_pass http://fastapi_cluster;

            # Pass real client IP and host info to FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Keep connections alive for performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}