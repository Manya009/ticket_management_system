
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,input,select,textarea,button{font-family:var(--font-sans)}

/* ── AUTH ── */
.auth-scene{min-height:680px;display:flex;background:var(--color-background-tertiary)}
.auth-left{width:220px;flex-shrink:0;background:#0f0f0f;display:flex;flex-direction:column;justify-content:space-between;padding:2rem 1.75rem;position:relative;overflow:hidden}
.auth-left-geo{position:absolute;inset:0;pointer-events:none}
.auth-left-logo{position:relative;z-index:1}
.auth-left-brand{font-size:13px;font-weight:500;color:#fff;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.auth-left-tagline{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px;line-height:1.5}
.auth-left-bottom{position:relative;z-index:1}
.auth-left-quote{font-size:12px;color:rgba(255,255,255,.35);line-height:1.6;font-style:italic}

.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-card{width:100%;max-width:360px}
.auth-heading{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.auth-subhead{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.75rem}

.seg{display:flex;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px;gap:3px;margin-bottom:1.25rem}
.seg-btn{flex:1;padding:6px;border:none;border-radius:6px;background:transparent;color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
.seg-btn.on{background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary)}

.fld{margin-bottom:.85rem}
.fld label{display:block;font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.fld textarea{resize:vertical;min-height:100px}
.pw-rel{position:relative}
.pw-rel input{padding-right:42px}
.eye-btn{position:absolute;right:0;top:0;height:100%;width:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--color-text-secondary)}
.eye-btn:hover{color:var(--color-text-primary)}
.eye-btn svg{width:15px;height:15px}

.slide-wrap{overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .22s;max-height:0;opacity:0}
.slide-wrap.open{max-height:90px;opacity:1}

.btn-full{width:100%;padding:10px;background:#0f0f0f;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;margin-top:.35rem;transition:opacity .15s}
.btn-full:hover{opacity:.8}
.btn-full:disabled{opacity:.35;cursor:not-allowed}
.auth-foot{text-align:center;font-size:13px;color:var(--color-text-secondary);margin-top:1rem}
.auth-foot a{color:var(--color-text-primary);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.msg-err{background:#FCEBEB;color:#791F1F;border:0.5px solid #F09595;border-radius:var(--border-radius-md);padding:9px 12px;font-size:13px;margin-bottom:1rem}
.msg-ok{background:#EAF3DE;color:#27500A;border:0.5px solid #97C459;border-radius:var(--border-radius-md);padding:9px 12px;font-size:13px;margin-bottom:1rem}

/* ── LAYOUT ── */
.app-shell{display:flex;min-height:680px}
.side{width:216px;flex-shrink:0;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column}
.side-top{padding:1.25rem 1.25rem .75rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.side-brand{display:flex;align-items:center;gap:8px}
.side-orb{width:28px;height:28px;border-radius:8px;background:#0f0f0f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.side-orb svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-brand-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.side-nav{flex:1;padding:.75rem 0}
.nav-section{padding:0 .75rem;margin-bottom:.25rem}
.nav-section-label{font-size:10px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.07em;text-transform:uppercase;padding:.5rem .5rem .25rem}
.nav-a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-secondary);cursor:pointer;transition:all .12s;user-select:none}
.nav-a svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-a:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.nav-a.active{background:#0f0f0f;color:#fff;font-weight:500}
.nav-a.active svg{stroke:#fff}
.side-footer{padding:1rem 1.25rem;border-top:0.5px solid var(--color-border-tertiary)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#3C3489;flex-shrink:0}
.user-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.user-name{font-size:12px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role-badge{font-size:10px;color:var(--color-text-secondary)}
.btn-so{width:100%;padding:6px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);color:var(--color-text-secondary);font-size:12px;cursor:pointer}
.btn-so:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}

.main-area{flex:1;background:var(--color-background-tertiary);overflow:auto}
.main-topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.topbar-sub{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.btn-cta{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#0f0f0f;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-cta:hover{opacity:.8}
.btn-cta svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}

.main-body{padding:1.5rem}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.sc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.1rem 1.25rem;position:relative;overflow:hidden}
.sc-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0}
.sc-accent.blue{background:#378ADD}
.sc-accent.amber{background:#EF9F27}
.sc-accent.green{background:#639922}
.sc-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.sc-val{font-size:26px;font-weight:500;color:var(--color-text-primary)}
.sc-meta{font-size:11px;color:var(--color-text-secondary);margin-top:3px}

/* ── TABLE ── */
.tbl-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.tbl-toolbar{padding:.75rem 1rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between}
.tbl-toolbar-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.tbl-count{font-size:12px;color:var(--color-text-secondary)}
.tbl-head{display:grid;padding:8px 14px;font-size:10px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.06em;text-transform:uppercase;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.tbl-row{display:grid;padding:11px 14px;border-bottom:0.5px solid var(--color-border-tertiary);align-items:center;font-size:13px;color:var(--color-text-primary);transition:background .1s;cursor:default}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:#FAFAFA}
.gc{grid-template-columns:48px minmax(0,1fr) 110px 90px}
.gw{grid-template-columns:48px minmax(0,1fr) 110px 90px 80px 90px 105px}
.tid{font-size:11px;color:var(--color-text-secondary);font-weight:500;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);padding:2px 7px;border-radius:20px;display:inline-block}
.ttitle{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tcat{font-size:12px;color:var(--color-text-secondary)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.p-open{background:#E6F1FB;color:#0C447C}
.p-in_progress{background:#FAEEDA;color:#633806}
.p-closed{background:#EAF3DE;color:#27500A}
.p-High{background:#FCEBEB;color:#791F1F}
.p-Medium{background:#FAEEDA;color:#633806}
.p-Low{background:#EAF3DE;color:#27500A}
.p-na{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.conf-wrap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--color-text-secondary)}
.conf-tr{flex:1;height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden;min-width:28px}
.conf-fi{height:100%;border-radius:2px;background:#0f0f0f}
.sel-status{font-size:12px;padding:4px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;width:100%}
.empty-tbl{padding:3rem 1.5rem;text-align:center}
.empty-icon{width:40px;height:40px;border-radius:12px;background:var(--color-background-secondary);margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:18px;height:18px;stroke:var(--color-text-secondary);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.empty-sub{font-size:13px;color:var(--color-text-secondary)}

/* ── NEW TICKET ── */
.form-outer{max-width:560px}
.form-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.form-card-head{padding:1.1rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.form-card-title{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.form-card-body{padding:1.5rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;align-items:center;gap:8px;margin-top:1.1rem}
.btn-ghost{padding:7px 16px;background:transparent;color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;cursor:pointer}
.btn-ghost:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.btn-dark{padding:7px 16px;background:#0f0f0f;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer}
.btn-dark:hover{opacity:.8}
.btn-dark:disabled{opacity:.35;cursor:not-allowed}

.pred-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-top:.75rem}
.pred-head{padding:.8rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px}
.pred-head-dot{width:8px;height:8px;border-radius:50%;background:#639922;flex-shrink:0}
.pred-head-dot.loading{background:#EF9F27;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pred-head-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.pred-body{padding:1.1rem 1.25rem}
.pred-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pred-item-label{font-size:10px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.pred-item-val{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.pred-bar{height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden;margin-top:8px}
.pred-fill{height:100%;background:#0f0f0f;border-radius:2px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.dots-row{display:flex;align-items:center;gap:10px;padding:.1rem 0}
.dot3{width:5px;height:5px;border-radius:50%;background:var(--color-text-secondary);animation:blink 1.1s infinite}
.dot3:nth-child(2){animation-delay:.16s}.dot3:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.pred-done-cta{margin-top:1rem;padding-top:.9rem;border-top:0.5px solid var(--color-border-tertiary)}
</style>

<div id="app"></div>

<script>
const B='http://localhost';
let S={pg:'login',role:'client',tok:null,uid:null,email:'',isW:false,tickets:[],err:'',ok:'',loading:false,sp:false};

const set=p=>{Object.assign(S,p);go()};

const SVG={
  eye_on:`<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eye_off:`<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`,
  ticket:`<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>`,
  plus:`<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  inbox:`<svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>`,
  all:`<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  logo:`<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`,
};

async function call(path,method='GET',body=null){
  const o={method,headers:{'Content-Type':'application/json'}};
  if(S.tok)o.headers.Authorization='Bearer '+S.tok;
  if(body)o.body=JSON.stringify(body);
  const r=await fetch(B+path,o);const d=await r.json();
  if(!r.ok)throw new Error(d.detail||'Error');return d;
}

async function login(email,pw){
  set({loading:true,err:''});
  try{
    const d=await call('/auth/login','POST',{email,password:pw});
    const p=JSON.parse(atob(d.access_token.split('.')[1]));
    S.tok=d.access_token;
    S.uid=p.sub;
    S.email=email;
    // ✅ set worker/admin flag from JWT payload
    S.isW = (p.is_worker === true) || (S.role === 'worker');

    const t=await call(S.isW?'/tickets/all_tickets':'/tickets/my_tickets').catch(()=>[]);
    set({loading:false,pg:'dashboard',tickets:t});
  }catch(e){set({err:e.message,loading:false})}
}
async function signup(email,pw,isW,wid){
  set({loading:true,err:''});
  try{
    await call('/auth/signup','POST',{email,password:pw,is_client:!isW,is_worker:isW,worker_id:wid||null});
    set({loading:false,ok:'Account created — sign in below.',pg:'login',err:''});
  }catch(e){set({err:e.message,loading:false})}
}
async function loadTickets(){
  try{const t=await call(S.isW?'/tickets/all_tickets':'/tickets/my_tickets');set({tickets:t})}catch(e){}
}

async function createTicket(title, description, category) {
  set({ loading: true, err: '' });

  try {
    await call('/tickets/create', 'POST', {
      user_id: S.uid,
      ticket_id: 0,
      title: title,
      description: description,
      category: category,
      status: 'open'
    });

    await loadTickets();

    set({
      loading: false,
      pg: 'dashboard',
      ok: 'Ticket submitted. Processing in background...'
    });

  } catch (e) {
    set({ err: e.message, loading: false });
  }
}


async function updateStatus(id,val){
  try{await call(`/tickets/update_status/${id}?status=${val}`,'PUT');
  await loadTickets()}
  catch(e){alert('Update failed')}
}

function fmtStatus(s){return s==='in_progress'?'In progress':s?s[0].toUpperCase()+s.slice(1):'—'}
function initials(e){return e?e.slice(0,2).toUpperCase():'??'}

function pwField(id,show,flag,ph){
  return`<div class="pw-rel"><input id="${id}" type="${show?'text':'password'}" placeholder="${ph}"/><button class="eye-btn" data-flag="${flag}">${show?SVG.eye_on:SVG.eye_off}</button></div>`;
}

function buildAuth(isLogin){
  return`<div class="auth-scene">
    <div class="auth-left">
      <svg class="auth-left-geo" viewBox="0 0 220 680" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="180" cy="80" r="120" fill="rgba(255,255,255,.03)"/>
        <circle cx="20" cy="400" r="160" fill="rgba(255,255,255,.025)"/>
        <circle cx="160" cy="620" r="100" fill="rgba(255,255,255,.03)"/>
        <line x1="0" y1="200" x2="220" y2="340" stroke="rgba(255,255,255,.06)" stroke-width="0.5"/>
        <line x1="0" y1="450" x2="220" y2="580" stroke="rgba(255,255,255,.06)" stroke-width="0.5"/>
        <rect x="30" y="250" width="40" height="40" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="0.5"/>
        <rect x="140" y="350" width="30" height="30" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="0.5"/>
        <rect x="60" y="480" width="50" height="50" rx="4" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.07)" stroke-width="0.5"/>
      </svg>
      <div class="auth-left-logo">
        <div class="auth-left-brand">Ticket System</div>
        <div class="auth-left-tagline">ML-powered support management for modern teams</div>
      </div>
      <div class="auth-left-bottom">
        <div class="auth-left-quote">"Resolve issues faster with intelligent ticket routing and priority detection."</div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-heading">${isLogin?'Sign in':'Create account'}</div>
        <div class="auth-subhead">${isLogin?'Welcome back — enter your details to continue.':'Join as a client or support worker.'}</div>
        ${S.err?`<div class="msg-err">${S.err}</div>`:''}
        ${S.ok?`<div class="msg-ok">${S.ok}</div>`:''}
        <div class="seg">
          <button class="seg-btn ${S.role==='client'?'on':''}" data-role="client">Client</button>
          <button class="seg-btn ${S.role==='worker'?'on':''}" data-role="worker">Worker</button>
        </div>
        <div class="fld"><label>Email address</label><input id="au-email" type="email" placeholder="you@example.com"/></div>
        <div class="fld"><label>Password</label>${pwField('au-pw',S.sp,'sp',isLogin?'Enter your password':'Create a password')}</div>
        <div class="slide-wrap ${S.role==='worker'?'open':''}">
          <div class="fld" style="padding-top:2px"><label>Worker ID</label><input id="au-wid" type="number" placeholder="Your assigned worker ID"/></div>
        </div>
        <button class="btn-full" id="auth-btn" ${S.loading?'disabled':''}>${S.loading?(isLogin?'Signing in…':'Creating…'):(isLogin?'Sign in':'Create account')}</button>
        <div class="auth-foot">${isLogin?'No account?':'Have an account?'} <a id="auth-sw">${isLogin?'Sign up':'Sign in'}</a></div>
      </div>
    </div>
  </div>`;
}

function buildShell(inner){
  const navItems=S.isW
    ?[{label:'All tickets',pg:'dashboard',icon:SVG.all}]
    :[{label:'My tickets',pg:'dashboard',icon:SVG.inbox},{label:'New ticket',pg:'new_ticket',icon:SVG.plus}];
  const ini=initials(S.email);
  return`<div class="app-shell">
    <div class="side">
      <div class="side-top">
        <div class="side-brand">
          <div class="side-orb">${SVG.logo}</div>
          <span class="side-brand-name">Ticket System</span>
        </div>
      </div>
      <nav class="side-nav">
        <div class="nav-section">
          <div class="nav-section-label">Navigation</div>
          ${navItems.map(n=>`<div class="nav-a ${S.pg===n.pg?'active':''}" data-nav="${n.pg}">${n.icon}${n.label}</div>`).join('')}
        </div>
      </nav>
      <div class="side-footer">
        <div class="user-row">
          <div class="user-avatar">${ini}</div>
          <div style="min-width:0">
            <div class="user-name">${S.email}</div>
            <div class="user-role-badge">${S.isW?'Worker':'Client'}</div>
          </div>
        </div>
        <button class="btn-so" id="so-btn">Sign out</button>
      </div>
    </div>
    <div class="main-area">${inner}</div>
  </div>`;
}

function buildDashboard(){
  const t=S.tickets||[];
  const open=t.filter(x=>x.status==='open').length;
  const inP=t.filter(x=>x.status==='in_progress').length;
  const closed=t.filter(x=>x.status==='closed').length;
  const isW=S.isW;
  const gc=isW?'gw':'gc';

  const header = isW
    ? `<div class="tbl-head ${gc}"><span>#</span><span>Title</span><span>Category</span><span>Status</span><span>Priority</span><span>Confidence</span><span>Update</span></div>`
    : `<div class="tbl-head ${gc}"><span>#</span><span>Title</span><span>Category</span><span>Status</span></div>`;

  const rows=t.length===0
    ?`<div class="empty-tbl"><div class="empty-icon">${SVG.inbox}</div><div class="empty-title">No tickets yet</div><div class="empty-sub">${isW?'No support requests have been submitted.':'Submit your first ticket to get started.'}</div></div>`
    :t.map(r=>`<div class="tbl-row ${gc}">
        <span class="tid">#${r.ticket_id}</span>
        <span class="ttitle">${r.title}</span>
        <span class="tcat">${r.category||'—'}</span>
        <span><span class="pill p-${r.status||'open'}">${fmtStatus(r.status)}</span></span>
        ${isW ? `
          <span>${r.predicted_priority?`<span class="pill p-${r.predicted_priority}">${r.predicted_priority}</span>`:`<span style="color:var(--color-text-secondary);font-size:13px">—</span>`}</span>
          <span>${r.confidence!=null?`<div class="conf-wrap"><span>${Math.round(r.confidence*100)}%</span><div class="conf-tr"><div class="conf-fi" style="width:${Math.round(r.confidence*100)}%"></div></div></div>`:`<span style="color:var(--color-text-secondary);font-size:13px">—</span>`}</span>
          <span><select class="sel-status" data-tid="${r.ticket_id}"><option value="open" ${r.status==='open'?'selected':''}>Open</option><option value="in_progress" ${r.status==='in_progress'?'selected':''}>In progress</option><option value="closed" ${r.status==='closed'?'selected':''}>Closed</option></select></span>
        ` : ''}
      </div>`).join('');

  const content=`
    <div class="main-topbar">
      <div><div class="topbar-title">${isW?'All support tickets':'My tickets'}</div><div class="topbar-sub">${t.length} ticket${t.length!==1?'s':''} total</div></div>
      ${!isW?`<button class="btn-cta" data-nav="new_ticket">${SVG.plus} New ticket</button>`:''}
    </div>
    <div class="main-body">
      <div class="stats-grid">
        <div class="sc"><div class="sc-accent blue"></div><div class="sc-label">Open</div><div class="sc-val">${open}</div><div class="sc-meta">awaiting response</div></div>
        <div class="sc"><div class="sc-accent amber"></div><div class="sc-label">In progress</div><div class="sc-val">${inP}</div><div class="sc-meta">being handled</div></div>
        <div class="sc"><div class="sc-accent green"></div><div class="sc-label">Closed</div><div class="sc-val">${closed}</div><div class="sc-meta">resolved</div></div>
      </div>
      <div class="tbl-card">
        <div class="tbl-toolbar"><span class="tbl-toolbar-title">Tickets</span><span class="tbl-count">${t.length} record${t.length!==1?'s':''}</span></div>
        ${header}
        ${rows}
      </div>
    </div>`;
  return buildShell(content);
}

function buildNewTicket(){
  const content=`
    <div class="main-topbar">
      <div><div class="topbar-title">New ticket</div><div class="topbar-sub">Describe your issue — we'll analyse it with ML</div></div>
    </div>
    <div class="main-body">
      <div class="form-outer">
        ${S.err?`<div class="msg-err" style="margin-bottom:1rem">${S.err}</div>`:''}
        <div class="form-card">
          <div class="form-card-head"><div class="form-card-title">Support request details</div></div>
          <div class="form-card-body">
            <div class="fld"><label>Title</label><input id="t-title" type="text" placeholder="Brief summary of your issue"/></div>
            <div class="form-row">
              <div class="fld"><label>Category</label><select id="t-cat"><option value="technical">Technical issue</option><option value="billing">Billing inquiry</option><option value="cancellation">Cancellation request</option><option value="product">Product inquiry</option><option value="refund">Refund request</option></select></div>
            </div>
            <div class="fld"><label>Description</label><textarea id="t-desc" placeholder="Describe your issue in as much detail as possible…"></textarea></div>
            <div class="form-actions">
              <button class="btn-ghost" data-nav="dashboard">Cancel</button>
              <button class="btn-dark" id="sub-btn" ${S.loading?'disabled':''}>${S.loading?'Submitting…':'Submit'}</button>
            </div>
          </div>
        </div>
       </div>
    </div>`;
  return buildShell(content);
}

function go(){
  const el=document.getElementById('app');
  if(!el)return;
  if(S.pg==='login')el.innerHTML=buildAuth(true);
  else if(S.pg==='signup')el.innerHTML=buildAuth(false);
  else if(S.pg==='dashboard')el.innerHTML=buildDashboard();
  else if(S.pg==='new_ticket')el.innerHTML=buildNewTicket();
  bind();
}

function bind(){
  document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>set({role:b.dataset.role,isW:b.dataset.role==='worker',err:'',ok:''})));
  document.querySelectorAll('[data-flag]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.flag;
    S[k]=!S[k];
    const inp=document.getElementById('au-pw');
    if(inp){
      inp.type = S[k] ? 'text' : 'password';
      b.innerHTML = S[k] ? SVG.eye_on : SVG.eye_off;
    }
  }));

  const sw=document.getElementById('auth-sw');
  if(sw)sw.addEventListener('click',()=>set({pg:S.pg==='login'?'signup':'login',err:'',ok:''}));

  const ab=document.getElementById('auth-btn');
  if(ab)ab.addEventListener('click',()=>{
    const email=document.getElementById('au-email').value.trim();
    const pw=document.getElementById('au-pw').value;
    S.isW=S.role==='worker';
    if(S.pg==='login'){login(email,pw)}
    else{const w=document.getElementById('au-wid');signup(email,pw,S.isW,w?parseInt(w.value)||null:null)}
  });

  const so=document.getElementById('so-btn');
  if(so)so.addEventListener('click',()=>set({pg:'login',tok:null,uid:null,email:'',isW:false,tickets:[],err:'',ok:'',sp:false}));

  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{
    const pg=el.dataset.nav;
    set({pg,err:'',pred:pg==='new_ticket'?null:S.pred,predLoading:false});
    if(pg==='dashboard')loadTickets();
  }));

  const sb=document.getElementById('sub-btn');
  if(sb)sb.addEventListener('click',()=>{
    const title=document.getElementById('t-title').value.trim();
    const desc=document.getElementById('t-desc').value.trim();
    const cat=document.getElementById('t-cat').value;
    if(!title||!desc){set({err:'Please fill in all fields.'});return}
    createTicket(title,desc,cat);
  });

  document.querySelectorAll('.sel-status').forEach(s=>s.addEventListener('change',()=>updateStatus(parseInt(s.dataset.tid),s.value)));
}

go();
</script>
